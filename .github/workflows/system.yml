name: Verify trace-time system
'on':
- push
- pull_request
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        python:
        - '3.12'
        - '3.13'
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
    - run: python -m pip install -r requirements-test.txt
    - run: python -m unittest -v
    - run: python trace_time.py examples/checkout.otlp examples/services.otlp
    - run: python trace_time.py --links examples/batch.otlp examples/enqueue-a.otlp examples/enqueue-b.otlp
    - uses: actions/checkout@v7
      with:
        ref: faa14f6d8730701c1829d3267a222a4099e5c6f5
        path: clocks
    - run: python clock_drill.py clocks
  clock-bracket-test:
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - run: python -m unittest -v
    - run: python clock_bracket.py examples/checkout.json --explain
    defaults:
      run:
        working-directory: modules/clock-bracket
