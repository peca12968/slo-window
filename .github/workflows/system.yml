name: Verify capacity-replay system
'on':
- push
- pull_request
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - run: python -m unittest -v
    - run: python replay.py examples/preview-burst.csv --workers 1 2 3 4 --staffing examples/preview-staffing.csv --queue 3 --details
    - uses: actions/checkout@v7
      with:
        ref: 301141a6e7351a5c7f6b2bb80dc10b1a3c6d0939
        path: dispatch-checkout
        persist-credentials: false
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
    - run: python dispatch_check.py dispatch-checkout
  fair-dispatch-scheduler:
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: modules/fair-dispatch/package-lock.json
    - run: npm ci
    - run: npm run check
    - run: npm test
    - run: npm run demo
    defaults:
      run:
        working-directory: modules/fair-dispatch
