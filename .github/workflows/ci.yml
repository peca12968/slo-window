name: Verify dashboard
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Check out the tested log producer
        uses: actions/checkout@v4
        with:
          repository: peca12968/access-log-rollup
          ref: f0598db162c034eb5755b2bd8e61b562b23896ff
          path: producer
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Convert checkout logs into browser input
        run: |
          dotnet build producer/src -c Release
          logs=(producer/examples/rotation-1.ndjson producer/examples/rotation-2.ndjson)
          dotnet producer/src/bin/Release/net10.0/access-rollup.dll "${logs[@]}" > "$RUNNER_TEMP/raw.csv"
          dotnet producer/src/bin/Release/net10.0/access-rollup.dll --dedupe "${logs[@]}" > "$RUNNER_TEMP/checkout.csv"
      - run: npm run test:e2e
        env:
          CHECKOUT_ROLLUP_CSV: ${{ runner.temp }}/checkout.csv
          RAW_ROLLUP_CSV: ${{ runner.temp }}/raw.csv
