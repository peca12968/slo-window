name: Verify bounded service replay
on: [push, pull_request]
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - run: python replay.py examples/preview-burst.csv --workers 1 2 3 --queue 3 --details
