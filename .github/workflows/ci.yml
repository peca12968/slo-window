name: Verify log rollup
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cli:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet build src -c Release
      - run: python -m unittest -v
      - uses: actions/checkout@v4
        with:
          repository: peca12968/bucket-verdict
          ref: 45fe432d87d451e8865a6fc639e320fdd3ae7502
          path: consumer
          persist-credentials: false
      - run: python latency_demo.py consumer/verdict.py
