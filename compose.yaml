services:
  db:
    image: postgres:17
    ports: ["127.0.0.1:55432:5432"]
    environment:
      POSTGRES_USER: relay
      POSTGRES_DB: relay
      POSTGRES_PASSWORD: local-demo-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - queue-data:/var/lib/postgresql/data
volumes:
  queue-data:
